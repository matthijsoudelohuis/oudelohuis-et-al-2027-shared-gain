[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharedgain"
version = "0.1.0"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
# Only the library is installed; analysis scripts live in 1_scripts/ and are run, not imported.
include = ["sharedgain*"]
